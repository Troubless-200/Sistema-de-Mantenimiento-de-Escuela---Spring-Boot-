<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inicio</title>
</head>
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

<body>

	<div class="container">
		<form method="post" th:object="${personas}" th:action="@{/personas/eliminar}">
			<div class="form-group">
				<label for="txtIdpersona">ID Persona</label>
				<input th:field="*{idpersona}" type="text" class="form-control" id="txtIdpersona" readonly="true">
			</div>
			<div class="form-group">
				<label for="txtNombre">Nombre</label>
				<input th:field="*{nombre}" type="text" class="form-control" id="txtNombre" readonly="true">
			</div>
			<div class="form-group">
				<label for="txtApellido">Apellido</label>
				<input th:field="*{apellido}" type="text" class="form-control" id="txtApellido" readonly="true" >
			</div>
			<div class="form-group">
				<label for="txtRut">RUT</label>
				<input th:field="*{rut}" type="text" class="form-control" id="txtRut" readonly="true">
			</div>
			<button type="submit" class="btn btn-primary">Eliminar</button>
		</form>
	</div>




</body>

</html>
