<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inicio</title>
</head>
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

<body>
	
	<h3>Mantenimiento Docentes</h3>

	<li class="nav-item active">
			                <a class="nav-link" href="/Menu/InicioProyecto"> Volver a Inicio <span class="sr-only">(actual)</span></a>
			            </li>
	
	<div class="container mt-4">
		
		<a th:href="@{/docentes/crear}" class="btn btn-primary">Crear Docente</a>
		
		<table class="table">
			<thead>
				<tr>
					<th scope="col">ID Docente</th>
					<th scope="col">tipo contrato</th>
					<th scope="col">ID Persona</th>
				 
				</tr>
			</thead>
			<tbody>
				<tr th:each="fila:${listaDocentes}">
					<td th:text="${fila.iddocente}"></td>
					<td th:text="${fila.tipocontrato}"></td>
					<td th:text="${fila.persona.idpersona}"></td>
					<td>
						<a th:href="@{/docentes/editar/{iddocente} (iddocente=${fila.iddocente}) }"
							class="btn btn-warning btn-sm">Editar</a>
						<a th:href="@{/docentes/eliminar/{iddocente} (iddocente=${fila.iddocente}) }"
							class="btn btn-danger btn-sm">Eliminar</a>
					</td>
				</tr>
				
			</tbody>
		</table>

	</div>


</body>

</html>
